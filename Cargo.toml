[package]
name = "symbolar"
version = "0.14.0"
edition = "2024"
rust-version = "1.85"
description = "Type-safe, Polars-compatible Vector Symbolic Architectures with storage and expression execution."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Christopher22/symbolar"
homepage = "https://christopher22.github.io/symbolar/"
documentation = "https://christopher22.github.io/symbolar/docs/symbolar/"
keywords = ["vsa", "hyperdimensional", "polars", "symbolic", "vectors"]
categories = ["algorithms", "data-structures", "science"]

[features]
default = ["polars", "parallel"]
polars = ["dep:polars"]
parallel = ["dep:rayon"]
serde = ["dep:serde"]

[dependencies]
bitvec = "1.0.1"
chacha20 = { version = "0.10.0", default-features = false, features = ["rng"] }
num-traits = "0.2.19"
parking_lot = "0.12.5"
polars = { version = "0.53.0", features = ["dtype-categorical"], optional = true }
rand = "0.10.1"
rayon = { version = "1.12.0", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
rustfft = "6.4.1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.2", features = ["wasm_js"] }

[dev-dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
